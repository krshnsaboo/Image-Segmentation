[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-image-segmentation"
version = "0.1.0"
description = "Semantic image segmentation using DeepLabV3-ResNet101"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."